name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: 格式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: 测试 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # 桌面壳依赖 WebKit，交给下面的 desktop job；这里只测核心逻辑，
      # 保证「规则 / 计划 / 隔离区 / 备份」在三平台行为一致。
      - name: clippy
        run: cargo clippy -p curator-core -p curator-cli --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test -p curator-core -p curator-cli --locked

  desktop:
    name: 桌面端编译 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 图形依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

      # 只编译不打包：这一步验证 tauri-build 能生成资源、前端产物能被嵌入。
      # 安装包与签名在 M4.5 单独处理（bundle.active 目前为 false）。
      - name: 编译桌面壳
        run: cargo build -p curator-desktop --locked

      - name: 冒烟 · CLI 能加载规则库
        run: cargo run -p curator-cli --locked -- rules validate
