[workspace]
resolver = "2"
members = ["crates/curator-core", "crates/curator-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ba1p1ao/agent-curator"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
globset = "0.4"
jwalk = "0.8"
chrono = "0.4"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
