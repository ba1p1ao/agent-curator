[package]
name = "curator-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentCurator 桌面壳（Tauri 2 + Vue3）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建必须开启：没有它，tauri-build 会给编译器打上 `cfg(dev)`，
# 程序运行时就去连 http://localhost:1420，用户看到的是 ERR_CONNECTION_REFUSED。
# `pnpm tauri build` 会自动带上；手工构建请显式 --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
curator-core = { path = "../crates/curator-core" }
tauri = { version = "2", features = [] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
